name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes out/ to GitHub Pages (custom domain sumusd.com).
# One-time setup in the repo: Settings > Pages > Source = "GitHub Actions", and set the custom domain.
# Provide the build-time config under Settings > Secrets and variables > Actions > Variables
# (all NEXT_PUBLIC_* are public — they are inlined into the client bundle, so Variables, not Secrets):
#   NEXT_PUBLIC_ENGINE_ADDRESS, NEXT_PUBLIC_SUMUSD_ADDRESS, NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
# Collateral flavors are NOT configured here — the app discovers them on-chain from the engine.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy; don't cancel a running one (let it finish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        env:
          NEXT_PUBLIC_ENGINE_ADDRESS: ${{ vars.NEXT_PUBLIC_ENGINE_ADDRESS }}
          NEXT_PUBLIC_SUMUSD_ADDRESS: ${{ vars.NEXT_PUBLIC_SUMUSD_ADDRESS }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
